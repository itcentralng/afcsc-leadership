<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Department of Air Warfare — Hall of Fame</title>
<link rel="icon" href="assets/icons/app.ico" />
<link rel="stylesheet" href="assets/fonts/fonts.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="stage-wrapper" id="stage-wrapper">
    <div class="stage" id="stage">

      <!-- ============ AMBIENT BACKGROUND: night sky, HUD grid, contrails ============ -->
      <div class="app-bg" aria-hidden="true">
        <div class="app-bg-glow"></div>
        <div class="app-bg-hud"></div>
        <div class="contrails">
          <span class="contrail contrail--a"></span>
          <span class="contrail contrail--b"></span>
          <span class="contrail contrail--c"></span>
        </div>
      </div>

      <!-- ============ PERSISTENT TOP BAR ============ -->
      <header class="topbar hidden" id="topbar">
        <div class="topbar-left">
          <button class="icon-btn" id="btn-home" aria-label="Home">
            <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5" /><path d="M5.5 10v9a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-9" /><path d="M9.5 20v-6h5v6" /></svg>
          </button>
          <nav class="topbar-nav" id="topbar-nav">
            <button class="topbar-link" data-nav="commandants" data-i18n="navCommandants"></button>
            <button class="topbar-link" data-nav="directors" data-i18n="navDirectors"></button>
          </nav>
        </div>
        <div class="topbar-brand">
          <img class="topbar-crest" src="assets/icons/afcsc.png" alt="Armed Forces Command and Staff College" />
          <div class="topbar-text">
            <span class="topbar-kicker" data-i18n="college"></span>
            <span class="topbar-title" data-i18n="department"></span>
          </div>
          <img class="topbar-crest topbar-crest--naf" src="assets/icons/naf.png" alt="Nigerian Air Force" />
        </div>
        <div class="topbar-right">
          <button class="icon-btn sound-btn hidden" id="btn-sound" aria-label="Mute background music" aria-pressed="false">
            <svg class="icon-sound-on" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
            <svg class="icon-sound-off" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="m16 9.5 5 5M21 9.5l-5 5"/></svg>
          </button>
          <button class="kiosk-close" id="btn-close" title="Close" aria-label="Close">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
      </header>

      <main id="screens">

        <!-- ============ WELCOME ============ -->
        <section class="screen active" id="screen-attract">
          <!-- heading tape across the top, as on a head-up display -->
          <div class="hud-tape" aria-hidden="true"><div class="hud-tape-track" id="hud-tape"></div><span class="hud-tape-caret"></span></div>
          <div class="horizon" aria-hidden="true"></div>

          <div class="cockpit">
            <div class="cockpit-text">
              <p class="cockpit-kicker"><span class="cockpit-kicker-bar"></span><span data-i18n="college"></span></p>
              <h1 class="cockpit-title">
                <span class="cockpit-title-small">Department of</span>
                <span class="cockpit-title-big">Air Warfare</span>
              </h1>
              <p class="cockpit-hof"><span data-i18n="hallOfFame"></span></p>
              <p class="cockpit-tagline" data-i18n="tagline"></p>
              <div class="gauges" id="attract-stats"></div>
              <button class="hud-cta" id="attract-cta">
                <span class="hud-cta-corner hud-cta-corner--tl"></span><span class="hud-cta-corner hud-cta-corner--tr"></span>
                <span class="hud-cta-corner hud-cta-corner--bl"></span><span class="hud-cta-corner hud-cta-corner--br"></span>
                <span class="hud-cta-dot"></span>
                <span data-i18n="touchToBegin"></span>
                <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
              </button>
            </div>

            <!-- radar scope: crests turning at the centre, portraits as blips
                 that light up as the sweep passes over them -->
            <div class="scope" aria-hidden="true">
              <span class="scope-ring scope-ring--1"></span>
              <span class="scope-ring scope-ring--2"></span>
              <span class="scope-ring scope-ring--3"></span>
              <span class="scope-cross"></span>
              <span class="scope-bearing"></span>
              <span class="scope-sweep"></span>
              <div class="scope-blips" id="scope-blips"></div>
              <div class="crest-flip">
                <div class="crest-flip-spin">
                  <img class="crest-face crest-face--front" src="assets/icons/afcsc.png" alt="" />
                  <img class="crest-face crest-face--back" src="assets/icons/naf.png" alt="" />
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- ============ HOME ============ -->
        <section class="screen" id="screen-home">
          <div class="home-header">
            <img class="home-crest" src="assets/icons/afcsc.png" alt="Armed Forces Command and Staff College" />
            <div class="home-header-text">
              <p class="eyebrow" data-i18n="college"></p>
              <h1 class="home-title" data-i18n="department"></h1>
              <div class="attract-rule home-rule"><span></span><em data-i18n="hallOfFame"></em><span></span></div>
            </div>
            <img class="home-crest home-crest--naf" src="assets/icons/naf.png" alt="Nigerian Air Force" />
          </div>
          <nav class="home-grid">
            <button class="hall-tile hall-tile--commandants" data-nav="commandants">
              <span class="hall-tile-art" id="home-commandants-art"></span>
              <span class="hall-tile-shade"></span>
              <span class="hall-tile-num">I</span>
              <span class="hall-tile-body">
                <span class="hall-tile-meta" id="home-commandants-meta"></span>
                <span class="hall-tile-title" data-i18n="menuCommandants"></span>
                <span class="hall-tile-sub" data-i18n="menuCommandantsSub"></span>
              </span>
              <span class="hall-tile-go"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
            </button>
            <button class="hall-tile hall-tile--directors" data-nav="directors">
              <span class="hall-tile-art" id="home-directors-art"></span>
              <span class="hall-tile-shade"></span>
              <span class="hall-tile-num">II</span>
              <span class="hall-tile-body">
                <span class="hall-tile-meta" id="home-directors-meta"></span>
                <span class="hall-tile-title" data-i18n="menuDirectors"></span>
                <span class="hall-tile-sub" data-i18n="menuDirectorsSub"></span>
              </span>
              <span class="hall-tile-go"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
            </button>
          </nav>
        </section>

        <!-- ============ COMMANDANTS ============ -->
        <section class="screen" id="screen-commandants">
          <div class="list-header">
            <img class="list-crest" src="assets/icons/afcsc.png" alt="" />
            <div class="list-title">
              <p class="eyebrow" id="cmd-years"></p>
              <h2 class="section-title" data-i18n="commandantsTitle"></h2>
            </div>
            <div class="list-tools">
              <div class="chips" id="cmd-chips"></div>
              <span class="list-hint" data-i18n="tapPortrait"></span>
            </div>
          </div>
          <div class="track-wrap">
            <div class="track" id="cmd-track"></div>
          </div>
        </section>

        <!-- ============ DIRECTORS: spotlight + honour wall ============ -->
        <section class="screen" id="screen-directors">
          <div class="dir-layout">
            <div class="spot">
              <div class="spot-head">
                <img class="list-crest list-crest--naf" src="assets/icons/naf.png" alt="" />
                <div>
                  <p class="eyebrow" id="dir-years"></p>
                  <h2 class="spot-title" data-i18n="directorsTitle"></h2>
                </div>
              </div>
              <div class="spot-card" id="spot-card">
                <div class="spot-portrait">
                  <div class="spot-frame"><img id="spot-photo" src="" alt="" /></div>
                  <span class="spot-no" id="spot-no"></span>
                  <span class="spot-progress"><span id="spot-progress"></span></span>
                </div>
                <div class="spot-info" id="spot-info">
                  <span class="tag" id="spot-tag"></span>
                  <p class="spot-rank" id="spot-rank"></p>
                  <h3 class="spot-name" id="spot-name"></h3>
                  <p class="spot-post" id="spot-post"></p>
                  <dl class="spot-facts">
                    <div><dt data-i18n="tenure"></dt><dd id="spot-tenure"></dd></div>
                    <div><dt data-i18n="duration"></dt><dd id="spot-duration"></dd></div>
                  </dl>
                  <div class="spot-succession" id="spot-succession"></div>
                </div>
              </div>
              <div class="spot-foot">
                <span class="spot-count" id="spot-count"></span>
                <div class="spot-nav">
                  <button class="round-btn" id="spot-prev" aria-label="Previous director"><svg viewBox="0 0 24 24"><path d="M15 6 9 12l6 6"/></svg></button>
                  <button class="round-btn" id="spot-next" aria-label="Next director"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
                </div>
              </div>
            </div>
            <div class="honour-wall" id="honour-wall"></div>
          </div>
        </section>

        <!-- ============ COMMANDANT BIOGRAPHY ============ -->
        <section class="screen" id="screen-bio">
          <div class="bio-wrap" id="bio-wrap">
            <aside class="bio-aside">
              <button class="back-link" id="bio-back">
                <svg viewBox="0 0 24 24"><path d="M15 6 9 12l6 6"/></svg>
                <span data-i18n="commandantsTitle"></span>
              </button>
              <div class="bio-frame" id="bio-frame"></div>
              <div class="bio-ordinal" id="bio-ordinal"></div>
            </aside>
            <div class="bio-main">
              <div class="bio-head">
                <span class="tag" id="bio-service"></span>
                <p class="bio-rank" id="bio-rank"></p>
                <h2 class="bio-name" id="bio-name"></h2>
                <p class="bio-post" id="bio-post"></p>
                <p class="bio-fullname" id="bio-fullname"></p>
              </div>
              <dl class="bio-facts" id="bio-facts"></dl>
              <div class="bio-panel" id="bio-panel"></div>
              <div class="bio-foot">
                <div class="bio-links" id="bio-links"></div>
                <div class="bio-nav">
                  <button class="round-btn" id="bio-prev" aria-label="Previous commandant"><svg viewBox="0 0 24 24"><path d="M15 6 9 12l6 6"/></svg></button>
                  <button class="round-btn" id="bio-next" aria-label="Next commandant"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
                </div>
              </div>
            </div>
          </div>
        </section>

      </main>

      <div class="idle-overlay hidden" id="idle-overlay"><span data-i18n="idleReturnNote"></span></div>

    </div>
  </div>

  <script src="data/content.js"></script>
  <script src="script.js"></script>
</body>
</html>
