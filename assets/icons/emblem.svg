<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Department of Air Warfare Hall of Fame — kiosk emblem.
       An original mark (wings over the national roundel) used until the
       official crest is supplied. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe7a6"/>
      <stop offset=".5" stop-color="#d8b45e"/>
      <stop offset="1" stop-color="#9c7630"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#cfd9e8"/>
      <stop offset="1" stop-color="#8797b0"/>
    </linearGradient>
    <radialGradient id="sky" cx=".5" cy=".38" r=".7">
      <stop offset="0" stop-color="#1d4f8f"/>
      <stop offset="1" stop-color="#081633"/>
    </radialGradient>
    <path id="arcTop" d="M52,200 A148,148 0 0,1 348,200"/>
    <path id="arcBottom" d="M34,200 A166,166 0 0,0 366,200"/>
  </defs>

  <circle cx="200" cy="200" r="196" fill="url(#gold)"/>
  <circle cx="200" cy="200" r="186" fill="#07122a"/>
  <circle cx="200" cy="200" r="122" fill="url(#sky)" stroke="url(#gold)" stroke-width="4"/>
  <circle cx="200" cy="200" r="178" fill="none" stroke="#d8b45e" stroke-width="1.5" stroke-dasharray="2 6" opacity=".7"/>

  <text font-family="Oswald, 'Arial Narrow', sans-serif" font-weight="600" font-size="24" letter-spacing="3.5" fill="#f1dc9c"><textPath href="#arcTop" startOffset="50%" text-anchor="middle">DEPARTMENT OF AIR WARFARE</textPath></text>
  <text font-family="Oswald, 'Arial Narrow', sans-serif" font-weight="500" font-size="20" letter-spacing="6" fill="#cfd9e8"><textPath href="#arcBottom" startOffset="50%" text-anchor="middle">★  AFCSC JAJI  ★</textPath></text>

  <!-- wings -->
  <g fill="url(#silver)" stroke="#07122a" stroke-width="1.2" transform="translate(200 210) scale(1.16) translate(-200 -210)">
    <path d="M186,206 C150,196 112,186 70,170 C88,186 104,194 124,200 C104,200 92,198 78,194 C94,208 112,214 132,216 C118,218 106,218 94,216 C112,228 140,232 170,226 Z"/>
    <path d="M214,206 C250,196 288,186 330,170 C312,186 296,194 276,200 C296,200 308,198 322,194 C306,208 288,214 268,216 C282,218 294,218 306,216 C288,228 260,232 230,226 Z"/>
  </g>

  <!-- roundel -->
  <circle cx="200" cy="212" r="34" fill="url(#gold)"/>
  <circle cx="200" cy="212" r="29" fill="#0b8a4a"/>
  <circle cx="200" cy="212" r="19" fill="#ffffff"/>
  <circle cx="200" cy="212" r="9" fill="#0b8a4a"/>

  <!-- star -->
  <path d="M200,112 l9.4,19 21,3 -15.2,14.8 3.6,21 -18.8,-9.9 -18.8,9.9 3.6,-21 -15.2,-14.8 21,-3 z" fill="url(#gold)"/>

  <!-- laurel ticks -->
  <g stroke="url(#gold)" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M150,258 q50,26 100,0"/>
  </g>
  <text x="200" y="296" text-anchor="middle" font-family="Oswald, 'Arial Narrow', sans-serif" font-weight="700" font-size="21" letter-spacing="5" fill="#f1dc9c">HALL OF FAME</text>
</svg>
